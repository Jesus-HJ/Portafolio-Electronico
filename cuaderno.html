<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuaderno · Mi Portafolio Digital</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/cuaderno.css" />
  </head>
  <body>
    <header>
      <div class="logo">Jesus Huaricallo Jaime</div>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="index.html#sobre-mi">Sobre mí</a>
        <a href="index.html#proyectos">Proyectos</a>
        <a href="cuaderno.html">Cuaderno</a>
      </nav>
      <div class="header-right">
        <button
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Cambiar tema"
          title="Cambiar tema claro/oscuro"
        >
          🌙
        </button>
      </div>
    </header>

    <main class="cuaderno-wrapper">
      <h1 class="cuaderno-title">Cuaderno</h1>
      <p class="cuaderno-subtitle">Registro semanal del curso</p>

      <section id="lista-semanas" class="semanas-grid"></section>

      <section id="detalle-semana" class="detalle oculto">
        <button id="volver">← Volver a las semanas</button>
        <h2 id="detalle-titulo"></h2>
        <p id="detalle-fecha"></p>
        <div id="detalle-contenido"></div>
        <div id="detalle-imagenes" class="galeria"></div>
      </section>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/cuaderno.js"></script>
  </body>
</html>
